services:

  redis:
    image: redis:8.8.0-alpine
    container_name: restock-redis
    volumes:
      - restock_redis:/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restock_network

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    env_file:
      - ./apps/api/.env.production
    container_name: restock-backend
    ports:
      - "3010:3010"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - restock_network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", 'node -e "fetch(''http://127.0.0.1:3010/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"' ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  restock_network:
    driver: bridge

volumes:
  restock_redis:

